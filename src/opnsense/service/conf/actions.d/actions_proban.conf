[start]
command:/usr/local/etc/rc.d/proban start
type:script
message:starting ProBAN engine

[stop]
command:/usr/local/etc/rc.d/proban stop
type:script
message:stopping ProBAN engine

[restart]
command:/usr/local/etc/rc.d/proban restart
type:script
message:restarting ProBAN engine

[status]
command:/usr/local/etc/rc.d/proban status;exit 0
type:script_output
message:request ProBAN engine status

[run]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Parabolic/engine.py
type:script_output
message:run the ProBAN engine once
