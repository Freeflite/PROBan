# ProBAN plugin repository for OPNsense. One-time setup, from the firewall's shell:
#
#   mkdir -p /usr/local/etc/pkg/keys
#   fetch -o /usr/local/etc/pkg/keys/proban.pub https://freeflite.github.io/PROBan/proban.pub
#   fetch -o /usr/local/etc/pkg/repos/ProBAN.conf https://freeflite.github.io/PROBan/ProBAN.conf
#
# Then install os-proban from System > Firmware > Plugins. New versions arrive through the
# normal OPNsense update check. Every package is signed; pkg verifies it with proban.pub.
ProBAN: {
  url: "https://freeflite.github.io/PROBan/repo",
  signature_type: "pubkey",
  pubkey: "/usr/local/etc/pkg/keys/proban.pub",
  mirror_type: "none",
  enabled: yes
}
